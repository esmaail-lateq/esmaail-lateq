name: Generate Snake Animation

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution snake SVGs with Custom Theme
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0E75B6&color_dots=#ebedf0,#b6e3ff,#60a5fa,#2563eb,#1d4ed8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00D2FF&color_dots=#161B22,#033A59,#04689B,#0E75B6,#00D2FF

      - name: Deploy snake SVGs to output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git reset
          mkdir -p .tmp_dist && cp dist/*.svg .tmp_dist/
          git rm -rf --cached . > /dev/null 2>&1 || true
          rm -rf * .github 2>/dev/null || true
          cp .tmp_dist/*.svg .
          rm -rf .tmp_dist
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git commit -m "chore: auto-generate custom styled contribution snake [skip ci]" || echo "No changes to commit"
          git push -f origin output
